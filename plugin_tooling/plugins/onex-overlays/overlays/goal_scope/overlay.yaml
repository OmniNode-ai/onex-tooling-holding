# Overlay for the landing goal's scope (OMN-19998).
#
# Read by node_idle_slot_fill_effect (load_goal_scope) as the "goal_scope" overlay, found under ONEX_SKILL_OVERLAY_ROOTS like every
# other overlay in this plugin, by the throughput tick's goal check and lab fill, the merge sweep's reader and the idle-turn
# guard. `key: scalar` lines and `key:` followed by `- item` lines only. An absent or invalid overlay puts nothing in scope and
# the tick says why; no value below has a default in code.
#
# The goal (operator /goal, 2026-11-05 about 12:40Z): landing works for the work we are keeping. In scope means public and private
# pull requests tied to delegation, the MVP, pilots, the cost estimator or the factory floor, plus the named landing prerequisites;
# everything else stays paused as draft and is not counted. RULING 2026-11-05T12:36:07Z puts the actual product in scope, registry_root
# included though private.
#
# Source rows, as of the watcher tick 2026-11-05T12:40:52Z:
#   in_scope_prs      the 45 pull requests the mvp-pr-order-1040 report ranks with an evidenced scope link (report sha256 prefix
#                     653c97075d17), plus the two product removals the draft pause continuation named
#   prerequisite_prs  the pull requests the draft pause lane kept ready by name (keep-ready-named in its restore list)
#   paused_prs        the rows of the draft pause restore lists of lanes draft-pause-our-prs-1220 and draft-pause-continue-1240
#                     (sha256 prefixes d00944ba9c3a and b2b9b147f102):
#                     what is out. A pull request in this list that is open and ready is a draft flipped back.
# 2026-11-06T0935Z (OMN-22602, set by lane scope-enforce-0925 from the classing of lane scope-enforce-0340 at 05:20Z, sha256 prefix c4d6a528dda6 of the added and removed entries):
# the landing controller reads this file at every tick and holds the operator's own pull request that is paused, unlisted or, when this file
# cannot be read, any (OMN-22570). The operator's open ready pull requests were read against the goal's words: delegation, MVP, pilots, the cost
# estimator, product, the floor, landing prerequisites and step 0 are listed; the lane dispatch, grant, blocked-fill and brief gate pull requests
# the HOLD rows of 2026-11-06T04:29Z to 04:31Z and 03:20Z bar before M0 PASS left in_scope_prs for paused_prs; the rest of the open ready ones that
# are none of the words were drafted and listed in paused_prs. This edit adds no pull request of a parked repository to either list.
# A pull request in neither list is outside the goal as well (everything else stays paused). Moving one in is an edit here.
# 2026-11-06T1210Z (OMN-22570, lane scope-rule-1200): omniclaude#3182 and #3183, the guard fixes (OMN-22559 and OMN-22558, children of OMN-22478,
# lab-proved with failing controls), moved from paused_prs to in_scope_prs. The ticket rule in goal_scope_ticket_rule/overlay.yaml admits an
# unlisted pull request of the operator by its ticket from now on, so a new pull request needs no entry here; the paused list still overrides it.
# 2026-11-13 (OMN-19998, RULING 2026-11-03T18:40:27Z and the operator's machinery-first order of 2026-11-02): omnimarket#6008, the omnimarket
# home of the Mac lab-fill tick patch (ticket OMN-24109), and overlays#416, its settings overlay, are listed as prerequisite pull requests.
# The landing controller held 6008 at 2026-11-13T17:54:41Z as KEPT_OUT via unlisted: no entry named it and the ticket rule did not admit it.
# This is factory machinery, so it is in scope. No other pull request is added.
# 2026-11-13 (RULING 2026-11-13T21:16:04Z, ticket OMN-19998, lane goal-roots-6802): of the 13 pull requests whose ticket chain ends at OMN-17427
# (which is no root on purpose), each was read by the subject of its own ticket against the 2026-11-06 categories. Three fit and are listed:
# omnimarket#5511 (OMN-20689: a host that drifted from main syncs its plugins by revision; category landing prerequisites, prerequisite_prs),
# omnimarket#5924 (OMN-23983: the factory board's host list reads the one host table reader; category the floor) and plugin-tooling-pkg#1872
# (OMN-24051: the hourly throughput tick keeps a time floor for its decision step; category the floor). omnimarket#6008 was listed on
# 2026-11-13 above; omnimarket#6042 and overlays#444 are admitted by the OMN-21611 root in goal_scope_ticket_rule. The other seven stay paused
# (unlisted) and are not named here as paused: omnibase_infra#5940 (pin refresh policy), omnibase_infra#5948 (a CI runner environment),
# ops_tooling_pkg#1571 and #1572 (code added to a frozen repository; the lab-fill launcher it re-lands is omnimarket#6008),
# omnimarket#5972 (alarm re-raise), overlays#195 (the work log's bus setting) and infra_repo#2007 (a beta board criterion): none names a
# 2026-11-06 category.
overlay_version: "1.0.0"
ticket: OMN-19998
ruling: "operator goal 2026-11-05 about 12:40Z: landing works for the work we are keeping; in scope means pull requests tied to delegation, the MVP, pilots, the cost estimator or the factory floor, plus the named landing prerequisites; RULING 2026-11-05T12:36:07Z puts the product (registry_root) in scope"

# Repositories whose every pull request is in scope: the actual product.
in_scope_repos:

# Lab-fill item kinds that act on a whole repository (a red landing branch, a shared red). They are in scope only in a repository
# that holds in-scope work, and stay one lane per repository.
repo_work_kinds:
- dev-red
- cause-red

# Lab-fill item kinds that repair the landing machinery itself (a host that drifted from main, a tick that cannot run). Every other
# kind (ticket, readback, experiment-design, m4-board-red) is outside the goal and waits.
prerequisite_kinds:
- lab-repair

