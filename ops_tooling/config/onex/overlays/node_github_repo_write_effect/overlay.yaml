# The GitHub login the PR write node's comments (and every lane's) appear under (OMN-17427). The login
# is the shared account behind the write node's token: a person's account name, so it is declared here
# and in no public repository (omnimarket's node_github_repo_write_effect contract declares none).
#
# Reader: plugin-tooling-pkg's /omni:pr-handoff (scripts/write_logins.py, used by handoff.sh and
# handoff_row.sh). A bot's PR has no author who can post its "Lab:" line, so a comment from one of these
# logins counts as the lab proof when it names the PR's live head. Looked up under each root of
# ONEX_SKILL_OVERLAY_ROOTS, then at config/onex/overlays of the ops_tooling_pkg checkout beside the
# registry root. A login is matched without its "[bot]" suffix or "app/" prefix, in lower case.
comment_author_logins:
  - <owner>

# The bus a client reaches this node on (OMN-22355; operator ruling 2026-11-03, "The default broker should be in the
# contract overlay"). Read by omnimarket's onex scm when no --bus-lane is given. The node runs in the dev lane's runtime,
# which holds the GitHub credential; the broker address and transport stay in config/lab/ci_bus_lanes.yaml.
event_bus:
  type: kafka
  lane: dev
