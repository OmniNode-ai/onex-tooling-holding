    repository is one of repos and none of excluded_repos, its title and fact name none of lab_markers
    (work that needs a lab host, a deploy, a migration or a live runtime to write the code, which a cloud
    session cannot reach), its estimate is at most max_estimate (or unset), and no live CLAIM, open PR,
    merge on the default branch, closed Linear state or earlier cloud send holds it. A sprint ticket also
    has to be not started (sprint_state_types) and unassigned or the operator's. Changing a list is a
