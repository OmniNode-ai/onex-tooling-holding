# Every node `onex run-node` is invoked for, with one place each is invoked from (OMN-22362).
#
# Operator ruling 2026-11-03: "The default broker should be in the contract overlay." omnibase_core
# #2254 makes `onex run-node` read the broker only from `event_bus` in the node's overlay,
# config/onex/overlays/<node>/overlay.yaml, and refuse with that path when it is not there. So a node
# in this list that lacks `event_bus` is a node whose callers all refuse once a release carries that
# change. tests/test_omnimarket_deployment_overlays_omn20935.py fails on that.
#
# Read from the callers' own files on each repository's default branch on 2026-11-03: skill
# dispatch commands (omniclaude), the pre-commit hook, the morning launchd units and the documented
# operator command of this repository, the runbook, and the DoD probe commands of ticket contracts.
# The architecture-discovery bus callers in omnimarket (kind bus-caller) dial three nodes through the
# bus without `run-node`; they read the same `event_bus` declaration (omnimarket#4996).
# The two source-control nodes `onex scm` dispatches to (node_github_repo_gateway_effect for the read
# verbs, node_github_repo_write_effect for the write verbs; `onex scm verbs` lists them) are listed with
# one `onex scm` caller each: `onex scm` reads the same `event_bus` declaration (omnimarket scm_cli.py).
# A node that is only named in prose, a plan, a test or a "do not run this" note is not listed.
#
# Add a node here in the same change that gives its caller a `run-node <node>` command. The launchd
# units of this repository are also scanned by the test, so a unit that gains a run-node call
# without an entry here fails it.

nodes:
  node_architecture_discovery_orchestrator:
    callers:
      - {repo: omnimarket, path: src/omnimarket/nodes/node_architecture_discovery_orchestrator/handlers/handler_architecture_discovery_cli.py, kind: bus-caller}
  node_baseline_capture:
