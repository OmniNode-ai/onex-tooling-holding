# The Hostile Reviewer's rejection judge (OMN-17427): the review bot that decides whether a
# `rejected: <reason>` reply clears a finding. Operator, 2026-10-21, on the thread gate's override:
# "No, not a bot to carry the override. A bot to create the review." Every agent replies through the
# operator's own GitHub account, so a rejection proves nothing by itself; this model reads the finding,
# the cited lines at the pull request head and the rejection, and accepts or refuses it with one
# sentence. No human override and no new credential.
#
# Readers: omnibase_infra's hostile-review-thread-gate.yml fetches this directory with the voters
# overlay beside it and passes this file to omniintelligence's `cli_review judge-rejections`
# (node_review_rejection_judge_compute), which loads it with the same resolver as the voters, registers
# it and calls it through the reviewer's own call_model. A judge is never a voter: one whose voter id or
# reviewer identity (endpoint plus model) matches a voter in overlay.yaml is never chosen, so a roster
# change that put this model among the voters would make every rejection fail closed until a new judge
# is named here. The first judge that is none of the voters judges; the rest are fallbacks in order.
#
# Why this model: the voters are the lab rung (192.0.2.127) and Claude Sonnet behind h908's review
# gateway. The judge job runs on a GitHub-hosted runner (a public repository adds no self-hosted job,
# OMN-19998), which reaches no lab host, so the judge is a Claude API model on the reviewer's own key:
# hostile-review-thread-gate.yml exports HOSTILE_REVIEW_ANTHROPIC_API_KEY to the judge step as
# REVIEW_ANTHROPIC_API_KEY, exactly as hostile-reviewer.yml does for the review step. Opus, not Sonnet,
# so the judge is a different model from the Sonnet voter, not only a different endpoint.
schema_version: "review_voters_overlay.v1"
provider_endpoints:
  anthropic: "https://api.anthropic.com"
voters:
  - voter_id: rejection-judge
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: REVIEW_ANTHROPIC_API_KEY
    required: true
    # One short answer per rejection: the finding, at most 41 lines of code and the rejection.
    timeout_seconds: 120
    max_retries: 2
    # No temperature: the Claude API refuses it for this model (`temperature` is deprecated for
    # this model, HTTP 400 on every judge call, measured 2026-10-23).
