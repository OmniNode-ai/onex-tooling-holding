#
# The operator-private facts the omnimarket architecture-discovery node takes from its caller
# (OMN-20679), and the bus its callers dial it on (OMN-22362). The node package holds none of the
# facts: `ModelDiscoveryOverlay` requires exactly the two keys below and refuses any other, so the
# discovery CLI drops `event_bus` from the `--overlay` file before it builds the request. The
# morning tick renders this file for the fire and exports it as ONEX_ARCHITECTURE_DISCOVERY_OVERLAY (a value the caller already set wins, unrendered); the
# node's bus caller reads it into the request.
#
# A braced upper-case variable name is resolved by the tick from the environment, then from config/lab/type_debt_scout.env,
# and the fire is refused when it resolves to nothing. The lab address is not written here: the
# hardcoded-model-config ratchet admits no new one.
#
# substrate_probe_url: the lab model endpoint every run re-probes to judge whether a candidate can
#   be delegated (the node's D4 and D5 checks).
# registry_dir: the registry clone's directory name, which the report text must never spell as a
#   path.
substrate_probe_url: "${LLM_CODER_URL}/v1/models"
registry_dir: registry_root
# event_bus (OMN-22362; operator ruling 2026-11-03, "The default broker should be in the contract
#   overlay"): the bus the callers dial this node on, read from this file and from nothing else (no
#   KAFKA_BOOTSTRAP_SERVERS, flag or code default). The node runs in the dev lane's runtime, the
#   shared bus of this workspace (config/onex/runtime/runtime_config.yaml); the broker address and
#   the client transport stay in config/lab/ci_bus_lanes.yaml.
event_bus:
  type: kafka
  lane: dev
