# The bus a client reaches the GitHub read gateway on (OMN-22355; operator ruling 2026-11-03, "The default broker should
# be in the contract overlay"). Read by omnimarket's onex scm read verbs when no --bus-lane is given. The node runs in the
# dev lane's runtime; the broker address and transport stay in config/lab/ci_bus_lanes.yaml.
event_bus:
  type: kafka
  lane: dev
