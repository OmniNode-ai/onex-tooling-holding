onex-worktree-prune = "ops_tooling_pkg.nodes.node_unattended_worktree_prune_effect.handlers.handler_unattended_prune_cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.27",
    "mypy>=1.13",
    "nodejs-wheel>=24,<25",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "shellcheck-py>=0.11.0.1",
    "types-jsonschema>=4.26.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling", "pyyaml>=6.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "src/ops_tooling_pkg/nodes/node_entry_point_registry_compute/handlers/handler_hatch_metadata_hook.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_tooling_pkg"]

[tool.uv]
# An editable install's entry points are written when uv builds it; rebuild when a contract changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/ops_tooling_pkg/nodes/node_entry_point_registry_compute/handlers/handler_hatch_metadata_hook.py" },
    { file = "src/ops_tooling_pkg/nodes/node_entry_point_registry_compute/**/*.py" },
    { file = "src/ops_tooling_pkg/nodes/*/contract.yaml" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
# pre-commit hands ruff explicit paths, which skip an exclude unless it is forced.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A passing test removes its tmp_path directory. The default keeps every one for the last three runs: a
# full run wrote 2490 MiB under TMPDIR on host-33-example (2026-11-05), and a runner TMPDIR is RAM charged
# to the runner container, so the kept directories left a shard 900 MiB of the 6144 MiB limit and it stalled.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "unit: fast, isolated tests",
]
