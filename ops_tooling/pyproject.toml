[project]
name = "ops-tooling-pkg"
version = "0.1.0"
description = "Private operator tooling for the OmniNode registry: the work-ledger append, the ledger publisher, the worktree reaper and prune, and the morning launchd trigger."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["entry-points"]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.26.0",
    "omnibase-core[kafka]>=0.47.47,<0.48.0",
    "omnibase-infra>=0.38.67,<0.39.0",
    "omnimarket>=0.4.312,<0.5",
    "pydantic>=2.11,<3",
]

[project.scripts]
onex-host-reconcile = "ops_tooling_pkg.nodes.node_host_reconcile_effect.handlers.handler_host_reconcile_cli:main"
