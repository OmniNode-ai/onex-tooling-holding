# Every effective observe-only path in the registry repositories (OMN-19998, plan unit N3).
#
# RULING 2026-09-29T12:02:35Z: no observe-only, report-only, shadow or advisory modes; every checker
# acts or blocks, and the existing ones are converted. A path is observe-only when a check runs and
# cannot stop anything. tests/observe_only/_observe_only_scan.py reads five shapes (kinds):
#   continue_on_error    a job or step with continue-on-error set to anything but false
#   ignored_exit         a check command line ending in `|| true`, `|| :` or `|| exit 0`
#   observe_mode         a mode key set to report_only, observe, shadow, advisory, warn or
#                        log_only, or a shadow / report_only / observe_only / advisory flag set true
#   advisory_name        a workflow job whose id or name says shadow, advisory, report-only, observe
#   python_mode_default  a Python assignment or parameter default setting such a mode or flag
#
# owner_repo is the registry repository whose maintainers convert the path, or retire it with a
# cited reason in the same change. It is a role, never a person.
#
# The check (tests/observe_only/test_observe_only_inventory_omn19998.py, the CI job
# nonblocking-path-inventory and the pre-commit hook observe-only-inventory) fails in both directions:
#   * a path the scan finds that is not listed here is a NEW observe-only path. Convert it so the
#     check acts or blocks; do not list it;
#   * an entry whose path the scan no longer finds is a converted path. Delete the entry.
# So this file shrinks as paths are converted. The failure message prints the exact YAML.
# On a change (the CI job and the hook) only this repository's own paths are scanned, and an entry of
# another repository may be deleted but not added. The other repositories' default branches are
# scanned by the scheduled workflow observe-only-inventory-cleanup, which opens the pull request that
# deletes their stale entries and fails its own run on a path not listed here (OMN-19998).
#
# First written from the default branches (origin/HEAD) of the clones read on 2026-10-13:
#   knowledge_base origin/main 0a5199650207
#   docs_repo origin/main 384613f322d7
#   registry_root origin/main 565a9c969d32
#   omnibase_core origin/dev e06f904a9baa
#   omnibase_infra origin/dev 8fd5208561bb
#   omnibase_spi origin/dev 592724dfd5bc
#   omniclaude origin/dev d6a31b6a938a
#   omnidash origin/dev f3ffde6096ef
#   omniintelligence origin/dev 798e98e7929c
#   omnimarket origin/dev 69fcd9778c46
#   omnimemory origin/dev 5ae1c7674ac9
#   infra_repo origin/dev 21675c9e43af
#   registry_root origin/dev c38515fae81d
# plugin-tooling-pkg has no clone on the host that wrote this; its row is the installed plugin tree
# 2072557d1734 (no finding). The CI job reads the repository itself.
schema_version: observe-only-inventory/v1
# The registry repositories the scan covers: the `repositories` list of the liveness sources declaration, which moved to the
# overlays repository with the declaration (OMN-20804), so the inventory names its own scope.
